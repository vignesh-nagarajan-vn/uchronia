name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Everything runs keyless in mock mode — no secrets in CI (§11.4).
env:
  UCHRONIA_MOCK: '1'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright chromium
        run: pnpm --filter @uchronia/web exec playwright install --with-deps chromium

      - name: Journey (mock mode)
        run: pnpm e2e

      - name: Upload journey trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7
