<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uchronia: A Chronicle of Times That Never Were</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e8eae3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1420" />
    <script>
      // Set the theme before paint to avoid a flash of the wrong paper.
      try {
        const stored = localStorage.getItem('uchronia-theme')
        const dark =
          stored === 'nitrate' ||
          (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
