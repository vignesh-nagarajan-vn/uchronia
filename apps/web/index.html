<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uchronia — a chronicle of times that never were</title>
    <script>
      // Set the theme before paint to avoid a flash of the wrong paper.
      try {
        const stored = localStorage.getItem('uchronia-theme')
        const dark =
          stored === 'nitrate' ||
          (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
